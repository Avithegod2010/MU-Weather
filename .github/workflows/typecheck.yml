name: Typecheck

on:
  push:
    branches: [master, 'arena/**']
  pull_request:

# Least privilege: this workflow only reads the repo and installs deps — it
# never needs to write anything back to GitHub.
permissions:
  contents: read

jobs:
  tsc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Locale key and placeholder audit
        run: node scripts/audit-locales.mjs

      - name: Static accessibility audit
        run: node scripts/audit-accessibility.mjs

      - name: Weather policy tests
        run: node scripts/test-weather-policies.mjs

      - name: Rain calibration tests
        run: node scripts/test-rain-calibration.mjs

      - name: Ensemble calibration tests
        run: node scripts/test-ensemble-calibration.mjs

      - name: Alert pipeline tests
        run: node scripts/test-alert-pipeline.mjs

      - name: Local data manager tests
        run: node scripts/test-local-data-manager.mjs

      - name: Model accuracy tests
        run: node scripts/test-model-accuracy.mjs

      - name: Provider failure tests
        run: node scripts/test-provider-failures.mjs

      - name: Release review gate logic tests
        run: node tests/releaseReviewGate.test.mjs

      - name: Perfetto comparison policy tests
        run: node tests/perfettoCompare.test.mjs

      - name: Visual API fixture audit
        run: python3 scripts/visual/audit_fixtures.py

      - name: Visual API fixture audit tests
        run: python3 -m unittest tests/test_weather_fixture_audit.py
