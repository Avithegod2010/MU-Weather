name: Typecheck

on:
  push:
    branches: [master]
  pull_request:

# Least privilege: this workflow only reads the repo and installs deps — it
# never needs to write anything back to GitHub.
permissions:
  contents: read

jobs:
  tsc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit
