name: Release review gate

on:
  workflow_call:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  human-review-signoffs:
    name: Human review sign-offs (advisory)
    runs-on: ubuntu-latest
    # Advisory on purpose: the sign-off sheet (TalkBack/VoiceOver passes and
    # 14 native-speaker translation reviews) is a to-do, not a shipped fact.
    # Report it loudly, but a pending sheet must not paint release tags red.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate release review records
        run: node scripts/check-release-reviews.mjs
